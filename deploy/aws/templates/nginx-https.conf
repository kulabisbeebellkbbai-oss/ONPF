# Per-request errors can include bearer URLs, so discard request logs at http
# scope as well as inherited access logging. Use ONPF safe operational metrics.
access_log off;
error_log /dev/null;
# This file is included at http scope by Ubuntu's sites-enabled include.
# Use the direct TCP client address, never a supplied forwarding header.
# Empty map keys exclude other methods/paths from the extra login limit.
map "$request_method:$uri" $onpf_login_key {
    default "";
    "POST:/login" $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=onpf_general:10m rate=@@REQUEST_RATE_PER_SECOND@@r/s;
limit_req_zone $onpf_login_key zone=onpf_login:10m rate=@@LOGIN_RATE_PER_MINUTE@@r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name @@PUBLIC_HOST@@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/onpf-acme;
        try_files $uri =404;
    }
    location / { return 308 https://@@PUBLIC_HOST@@$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@PUBLIC_HOST@@;
    ssl_certificate /etc/letsencrypt/live/@@PUBLIC_HOST@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@PUBLIC_HOST@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Strict HTTPS CSRF requires a same-origin Referer on form submissions.
    # Keep referrers off other origins and emit one policy, even with older apps.
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "same-origin" always;
    # Also protect Nginx-generated errors (including 429/413).
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    limit_req_status 429;
    location / {
        limit_req zone=onpf_general burst=@@REQUEST_BURST@@ nodelay;
        limit_req zone=onpf_login burst=@@LOGIN_BURST@@ nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host @@PUBLIC_HOST@@;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-By "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
