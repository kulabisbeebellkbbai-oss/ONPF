# Bootstrap only: no application proxy before the operator obtains HTTPS.
access_log off;
error_log /dev/null;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name @@PUBLIC_HOST@@;
    client_max_body_size 26m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/onpf-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
